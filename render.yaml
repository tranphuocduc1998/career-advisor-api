services:
  - type: web
    name: career-advisor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false        # Điền thủ công trên Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false        # Điền thủ công trên Render dashboard
    healthCheckPath: /health